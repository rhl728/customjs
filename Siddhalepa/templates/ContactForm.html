<div class="page-inner-wrapper">
  <form class="w-full mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2 md:gap-x-7 gap-y-4"
    @submit="getFormValues">

    <template v-for="(field,index) in slotData.settings.sys_attribute">
      <template v-if="slotData.helpers.InArray('CONTACT', field.type) && field.is_visible">
        <template v-if="field.code == 'subject' || field.code == 'message'">
          <form-custom-field-snippet :field="field"
            :custom_fields_cls="['w-full','md:col-span-2','lg:col-span-1','xl:col-span-2']" />
        </template>
        <template v-else-if="field.code == 'phone'">
          <div class="form-group w-full col-span-1 phone">
            <label class="block text-gray-600 font-semibold text-sm leading-none mb-3 cursor-pointer required"
              for="grid-tel">
              {{field.label}}
              <template v-if="field.is_required">*</template>
            </label>

            <div class="contact-wrapper">
              <!-- calling code -->
              <div class="flex">
                <div class="w-1/4 xs:w-2/4 border border-gray-300 rounded-md overflow-hidden1">
                  <template v-if="slotData.form.callingCode">
                    <multiselect id="calling-code" name="calling-code" :options="slotData.countries"
                      class="calling-code-dropdown h-full no-border" track-by="code" v-model="slotData.form.callingCode"
                      label="calling_code" :searchable="true" :allow-empty="false" select-label="" deselect-label=""
                      selected-label="" placeholder="">
                      <template slot="singleLabel" slot-scope="{ option }">
                        <span class="h-[23px] mt-1 block">{{ option.calling_code }}</span>
                      </template>

                      <template slot="option" slot-scope="props" select-label="">
                        <span class="calling-code-value">
                          <img :src="props.option.flag" mr="1" class="inline-block" />
                          <span class="name">{{props.option.calling_code}}</span>
                        </span>
                      </template>

                      <template slot="noResult">
                        <span class="block">No records found.</span>
                      </template>
                    </multiselect>
                  </template>
                </div>

                <input
                  class="ml-2 py-2 px-4 md:px-5 w-full appearance-none border text-input text-xs lg:text-sm font-body rounded-md placeholder-body placeholder-slate-400 min-h-12 transition duration-200 ease-in-out bg-white border-gray-300 focus:outline-none focus:border-heading h-11 md:h-12"
                  type="text" onkeypress="return (event.charCode >= 48 && event.charCode <= 57) || event.charCode == 45"
                  id="grid-tel" v-model="slotData.form.contactNumber" :maxlength="slotData.form.contactMaxLen"
                  :placeholder="field.label" />
              </div>
              <p v-if="slotData.form.contactError" class="my-2 text-xs text-red-500">
                {{slotData.language.contact.errors.contactEmpty}}
              </p>
              <p v-if="slotData.form.contactInvalid" class="my-2 text-xs text-red-500">
                {{slotData.language.contact.errors.contactInvalid}}
              </p>
              <p v-if="slotData.form.contactMaxLenError" class="my-2 text-xs text-red-500">
                {{slotData.language.contact.errors.contactMaxLength}}
              </p>
            </div>
          </div>
        </template>
        <template v-else-if="field.input_model == 'textarea'">
          <form-custom-field-snippet :field="field" :custom_fields_cls="['w-full','md:col-span-2','lg:col-span-1','xl:col-span-2']" />
        </template>
        <template v-else>
          <form-custom-field-snippet :field="field" :custom_fields_cls="['w-full','col-span-1']"/>
        </template>
      </template>
    </template>

    <div class="flex flex-wrap w-full md:col-span-2 lg:col-span-1 xl:col-span-2"
      v-if="slotData.submitError || slotData.submitSuccess">
      <div class="w-full">
        <div v-if="slotData.submitError" class="submit-error submit-msg text-xs text-red-500">
          {{ slotData.submitError }}
        </div>

        <div v-if="slotData.submitSuccess" class="submit-success submit-msg text-xs text-green-700">
          {{ slotData.submitSuccess }}
        </div>
      </div>
    </div>

    <div class="flex flex-wrap w-full md:col-span-2 lg:col-span-1 xl:col-span-2">
      <div class="w-full flex-wrap">
        <div class="w-full">
          <button type="submit" variant="primary"
            class="submit-button text-[13px] md:text-base leading-4 inline-flex items-center cursor-pointer transition ease-in-out duration-300 font-semibold font-body text-center justify-center border-0 border-transparent rounded-md placeholder-white focus-visible:outline-none focus:outline-none bg-primary text-white px-5 md:px-6 lg:px-8 py-4 md:py-3.5 lg:py-4 hover:text-white hover:bg-gray-600 hover:shadow-cart h-11 md:h-12 w-fit mt-1.5"
            :disabled="slotData.submitLoading">
            <span class="button-label" v-if="slotData.submitLoading">
              <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
            </span>
            <span class="button-label" v-else>
              {{slotData.language.contact.fields.submit}}
            </span>
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
