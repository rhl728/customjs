<div
  class="grid gap-4 mt-4 grid-cols-2 md:grid-cols-3"
  :class="[columns?`lg:grid-cols-${slotData.colCount} xl:grid-cols-${slotData.colCount}`:  setCols ]"
>
  <template v-for="(row, index) in productsArray.length">
    <div
      class="item bg-white rounded-md hover:shadow-md hover:-translate-y-2 transition-all duration-500"
      v-for="(product, key) in productsArray[index]"
    >
      <product-item-section
        v-bind:data="product"
        :show_attribute_images="true"
        @updateFavorite="onUpdateFavorite"
      />
    </div>
  </template>
</div>
