<!-- :class="[ type == 'grid' ? '__': '__']" -->

<div class="cart-drawer-body flex flex-col">
    <div
        :class="[ type == 'grid' ? 'overflow-x-auto cart-drawer-content': 'mb-4', slotData.selectedProducts && !Object.keys(slotData.selectedProducts).length ? 'flex items-center': '']">

        <div :class="[ type == 'grid' ? 'px-5 md:px-7': '']" class="w-full">


            <div v-if="type == 'list'"
                class="flex p-4 rounded-md bg-gray-100 text-base font-semibold text-heading lg:text-lg">
                <span>
                    {{ slotData.language.orderConfirmation.productHeader.product }}
                </span>
                <span class="ml-auto flex-shrink-0">
                    {{ slotData.language.orderConfirmation.productHeader.subTotal }}
                </span>
            </div>

            <template v-if="slotData.selectedProducts && Object.keys(slotData.selectedProducts).length">
                <div v-for="product in slotData.selectedProducts"
                    class="group w-full h-auto flex justify-start items-center bg-white  border-b border-gray-300 relative last:border-b-0"
                    :class="[ type == 'grid' ? 'py-4 ': 'py-4 lg:px-3']">

                    <a :href="'/'+ product.url_key" class="contents">
                        <div class="item-image md:relative flex  rounded-md md:overflow-hidden bg-gray-200 flex-shrink-0 mr-4"
                            :class="[ type == 'grid' ? 'w-16 md:w-20 h-16 md:h-20': 'w-16 h-16']">

                            <template
                                v-if="product.image !== '' && (!product.images || product.image_type === 'image')">

                                <!-- <div 
                                    class="thumb border rounded-md border-gray-300 flex-shrink-0 w-full h-full bg-contain bg-center bg-no-repeat bg-gray-100" 
                                    v-bind:style="{'background-image': 'url(' + product.thumb + ')'}" 
                                    v-bind:title="product.name"
                                    ></div> -->


                                <img 
                                    :src="`https://shop.siddhalepa.lk${product.image.substring(product.image.indexOf('/productImages'))}`" 
                                    class="thumb border rounded-md border-gray-300 flex-shrink-0 w-full h-full object-contain object-center  bg-gray-100"
                                    :alt="product.name" :title="product.name" loading="lazy" decoding="async">

                            </template>
                            <template v-else>


                                <img class="thumb border object-center object-contain w-full h-full bg-gray-100"
                                    src="$$__client_media_url__$$/$$__client_media_path__$$/no-image.png"
                                    :alt="product.name" :title="product.name" loading="lazy" decoding="async">

                            </template>


                        </div>
                    </a>


                    <div class="flex flex-col w-full overflow-hidden">
                        <div class="item-name truncate text-sm text-heading mb-1 -mt-1 pr-8">
                            <a :href="'/'+ product.url_key">
                                <span>{{product.name}}</span>
                            </a>
                        </div>

                        <div :class="[ type == 'grid' ? 'mb-1': '']" class="text-xs md:text-sm text-body">
                            <span class="final-product-price" v-if="product.display_price">
                                {{ slotData.orderCurrency }}
                                <template v-if="slotData.currencyChanged">
                                    --.--
                                </template>
                                <template v-else>
                                    <template v-if="slotData.flashOrder">
                                        {{ slotData.helpers.PriceFormat(product.discount_price) }}
                                    </template>
                                    <template v-else>
                                        {{ slotData.helpers.PriceFormat(product.display_price) }}
                                    </template>
                                </template>
                                x {{ product.qty }}
                            </span>


                            <div class="item-code truncate text-sm text-heading mt-1 pr-8 text-gray-400"><span>SKU:
                                </span><span>{{product.sku}}</span></div>


                            <template v-if="product.back_order">
                                <template v-if="product.qty > product.available_now_qty">
                                    <span class="out-of-stock text-gray-400 block text-red-600">
                                        <template v-if="product.stock_status_name">
                                            {{product.stock_status_name}}
                                        </template>
                                        <template v-else>
                                            {{slotData.language.outOfStock}}
                                        </template>
                                    </span>
                                </template>
                            </template>

                            <div class="super-attributes text-gray-400" v-if="product.attributes">
                                <div class="attribute" v-for="attr in product.attributes">
                                    <span class="name align-middle">{{ attr.label }}:</span>
                                    <span class="value align-middle">
                                        <template v-if="slotData.showAttributeImages && attr.image">
                                            <img :src="attr.image"
                                                class="w-[18px] h-[18px] rounded-3xl inline-block ml-1 mt-1 border border-gray-200"
                                                :title="attr.value" alt="img" loading="lazy" decoding="async" />
                                        </template>
                                        <template v-else>
                                            {{attr.value}}
                                        </template>
                                    </span>
                                </div>
                            </div>

                            <template v-if="slotData.settings.default_menu_type != 'widivout_available_now'">
                                <template v-if="product.buy_now == 1">
                                    <template v-if="product.available_now_qty > 0">
                                        <span class="available-for-today collapse-view block text-primary">
                                            {{product.available_now_qty}}
                                            <template v-if="product.available_now_qty == 1">
                                                {{slotData.language.cart.availableForToday.countAfterOneItemText}}
                                            </template>
                                            <template v-else>
                                                {{slotData.language.cart.availableForToday.countAfterMoreItemsText}}
                                            </template>
                                        </span>
                                    </template>
                                </template>
                            </template>

                            <template v-if="slotData.settings.order_manage_stock == '1'">
                                <!-- <template v-if="product.buy_now == 0">
                                    <span class="quantity-availability block text-red-600">{{slotData.language.cart.quantityAvailability}}</span>
                                </template>
                                <template v-else> -->
                                <template
                                    v-if="product.buy_now == 1 && product.available_now_qty < product.qty && !product.back_order">
                                    <span
                                        class="quantity-availability block text-red-600">{{slotData.language.cart.quantityAvailability}}</span>
                                </template>
                                <!-- </template> -->
                            </template>

                        </div>

                        <div v-if="type == 'grid'"
                            class="flex items-center md:items-end justify-between flex-row-reverse md:flex-row">
                            <add-to-cart-button-snippet v-bind:product="product" />
                            <div>
                                <div class="font-semibold text-sm text-heading leading-5">
                                    {{slotData.orderCurrency}}
                                    <template v-if="slotData.currencyChanged">
                                        --.--
                                    </template>
                                    <template v-else>
                                        <template v-if="product.total_price">
                                            <span>{{ slotData.helpers.PriceFormat(product.total_price) }}</span>
                                        </template>
                                        <template v-else>
                                            <span>{{ slotData.helpers.PriceFormat(product.display_price * product.qty)
                                                }}</span>
                                        </template>
                                    </template>
                                </div>


                                <div v-if="product.tier_price"
                                    class="has-offer line-through text-sm font-normal text-light">

                                    <div v-if="product.tier_price < product.unit_price">
                                        <div v-if="product.display_price < product.tier_price">
                                            {{slotData.orderCurrency}}
                                            <template v-if="slotData.currencyChanged">
                                                --.--
                                            </template>
                                            <template v-else>
                                                <span>{{ slotData.helpers.PriceFormat(product.tier_price * product.qty)
                                                    }}</span>
                                            </template>
                                        </div>
                                        <div v-else>
                                            {{slotData.orderCurrency}}
                                            <template v-if="slotData.currencyChanged">
                                                --.--
                                            </template>
                                            <template v-else>
                                                <span>{{ slotData.helpers.PriceFormat(product.unit_price * product.qty)
                                                    }}</span>
                                            </template>
                                        </div>

                                    </div>
                                    <div v-else>
                                        {{slotData.orderCurrency}}
                                        <template v-if="slotData.currencyChanged">
                                            --.--
                                        </template>
                                        <template v-else>
                                            <span>{{ slotData.helpers.PriceFormat(product.tier_price * product.qty)
                                                }}</span>
                                        </template>
                                    </div>
                                </div>

                                <div v-else>
                                    <div v-if="(!product.msrp_price || product.msrp_price < product.initial_price)  && product.initial_price && product.display_price && (product.initial_price != product.display_price)"
                                        class="has-offer line-through text-sm font-normal text-light">
                                        {{slotData.orderCurrency}}
                                        <template v-if="slotData.currencyChanged">
                                            --.--
                                        </template>
                                        <template v-else>
                                            <span>{{ slotData.helpers.PriceFormat(product.initial_price * product.qty)
                                                }}</span>
                                        </template>
                                    </div>
                                    <div v-if="product.msrp_price>product.initial_price && product.msrp_price>product.display_price"
                                        class="has-offer line-through text-sm font-normal text-light">
                                        {{slotData.orderCurrency}}
                                        <template v-if="slotData.currencyChanged">
                                            --.--
                                        </template>
                                        <template v-else>
                                            <span>{{ slotData.helpers.PriceFormat(product.msrp_price * product.qty)
                                                }}</span>
                                        </template>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>


                    <div v-if="type == 'list'">

                        <div class="font-semibold text-sm md:text-base text-heading leading-5 flex">
                            <span class="pr-0.5">{{slotData.orderCurrency}}</span>
                            <template v-if="slotData.currencyChanged">
                                --.--
                            </template>
                            <template v-else>
                                <template v-if="product.total_price">
                                    <span>{{ slotData.helpers.PriceFormat(product.total_price) }}</span>
                                </template>
                                <template v-else>
                                    <span>{{ slotData.helpers.PriceFormat(product.display_price * product.qty) }}</span>
                                </template>
                            </template>
                        </div>

                    </div>

                    <div class="absolute right-0 top-2 md:top-4">
                        <remove-item-button-snippet v-if="type == 'grid'" v-bind:id="product.id"
                            v-bind:name="product.name" />
                    </div>

                </div>
            </template>

        :class="{ 'border-t' : slotData.selectedProducts && Object.keys(slotData.selectedProducts).length }">

            show_cart_instruction="true" show_button="false" hide_prices="true" button_price="true"
            show_total_save="true"

            minimum_order_text="true" />
    </div>

</div>
