<div class="add-to-cart bg-gray-100 rounded-clg h-8 md:h-9 overflow-hidden group mt-1 min-w-[90px]  md:min-w-[115px] max-w-[180px]">

    <!-- secondary adding(+) and removing(-) buttons -->

    <template v-if="slotData.selectedProducts && slotData.selectedProducts[productId]">
        <div class="flex items-center justify-between flex-shrink-0 h-8 overflow-hidden detail-count-btn-wrapper group rounded-clg md:h-9 shadow-navigation" :class="slotData.bulkEdit? 'bg-gray-200' : 'bg-primary text-white'">
            <button class="flex items-center justify-center flex-shrink-0 h-full transition ease-in-out duration-300 min-w-[33%] focus:outline-none w-8 md:w-9 hover:text-white hover:bg-primary bg-transparent focus:outline-none" v-on:click="updateItem(product, 'reduce')">
                <b-icon class="w-5 h-5 add-to-cart-icon" icon="dash" ></b-icon>
            </button>
            
            <input type="number" min="1" step="1" aria-label="cart-list" v-model="slotData.productQty" :class="slotData.bulkEdit?'group-hover:border-primary focus-visible:outline-primary focus:outline outline-1 outline-primary bg-gray-100' : 'focus:outline-none bg-transparent'" class="font-semibold flex items-center text-center h-full transition duration-250 ease-in-out cursor-auto flex-shrink-0 text-xs md:text-sm  min-w-[35%] w-8 md:w-10" :readonly="true"/> 
            <!-- v-on:focusout="onFocusOutQty" -->
            <button class="flex items-center justify-center h-full flex-shrink-0 transition ease-in-out duration-300 min-w-[33%] focus:outline-none w-8 md:w-9 hover:text-white hover:bg-primary bg-transparent focus:outline-none"  v-on:click="updateItem(product, 'add')"> 
                <b-icon class="w-5 h-5 add-to-cart-icon" icon="plus" ></b-icon>
            </button>
        </div>
    </template>

     <!-- fresh add to cart button (+) -->
    <template v-else>
        <!--  <div class="add-to-cart-button"> -->

            <!-- :disabled="this.getSelectedItemCount >= this.maxItemValue" -->
            <button v-on:click="updateItem(product, 'add')"  class="flex items-center w-full h-full font-semibold uppercase add-to-cart group-hover:bg-primary whitespace-nowrap">
                <template v-if="product.product_type == 'configurable' && slotData.productQty>=0">
                    <span class="px-4 text-xs button-label grow md:text-sm group-hover:text-white">{{slotData.selectOptionsText}}</span>
                </template>
                <template v-else>
                    <span class="px-4 text-xs button-label grow md:text-sm group-hover:text-white">{{slotData.text}}</span>
                    <span class="flex items-center justify-center inline-block h-full ml-auto text-lg bg-gray-200 button-pre-icon w-9 group-hover:bg-gray-700 group-hover:text-white">
                        <b-icon class="w-6 h-6 md:w-7 md:h-7" icon="plus"></b-icon>
                    </span>
                </template>
            </button>
       <!--  </div> -->
    </template>
</div>
