<div>
  <div
    class="fixed inset-0 bg-black transition-all duration-300"
    :class="[ is_active ? 'opacity-30 pointer-events-auto' : 'opacity-0 pointer-events-none' ]"
    style="z-index: 40"
  ></div>

  <div
    id="DeleteReviewPopup"
    class="fixed inset-0 flex items-center justify-center overflow-y-auto"
    role="dialog"
    aria-modal="true"
    :class="[ is_active ? 'block' : 'hidden' ]"
    style="z-index: 50"
  >
    <div class="relative p-4 w-full max-w-[480px] md:h-auto">
      <div class="relative bg-white rounded-lg shadow p-6 flex flex-col max-h-[90vh]">
        <div class="flex flex-col space-y-1">
            <div class="flex justify-end">
                <button v-on:click="closeModal">
                    <b-icon class="w-4 h-4 text-black" icon="x-lg"></b-icon>
                </button>
            </div>
            <div class="flex flex-col space-y-6">
                <div class="flex flex-col space-y-3 text-center items-center">
                    <span class="w-[56px] h-[56px] bg-[#D40C0C]/10 rounded-full flex justify-center items-center">
                        <span class="w-10 h-10 bg-[#D40C0C] rounded-full flex justify-center items-center">
                            <b-icon class="w-6 h-6 text-white" icon="exclamation-circle"></b-icon>
                        </span>
                    </span>
                    <span class="text-base font-semibold text-[#212121]">Remove the Review from This Product</span>
                    <span class="text-sm font-semibold text-[#5A5A5A]">Are you sure you want to remove this review? Once removed, it will no longer be visible to others.</span>
                </div>
                <div class="w-full flex flex-row space-x-4 font-normal text-xl">
                    <button 
                        :disabled="slotData.isDeleting" 
                        :class="slotData.isDeleting ? 'opacity-50 cursor-not-allowed' : 'opacity-100'"
                        class="w-full bg-[#EEEDED] text-[#212121] py-4 rounded-lg" v-on:click="closeModal"
                    >
                        Keep
                    </button>
                    <button 
                        :disabled="slotData.isDeleting"
                        :class="slotData.isDeleting ? 'opacity-50 cursor-not-allowed' : 'opacity-100'"
                        class="w-full bg-[#D40C0C] text-white py-4 rounded-lg"
                        @click="DeleteReview"
                    >
                        Remove
                    </button>
                </div>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>
