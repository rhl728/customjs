<div class='installment-container'>
    <template v-if="pageView=='checkout'">
        <span class='installment-label'>Pay with 3 installments of</span>
        <span class='installment-price'>{{ slotData.display_currency }} {{slotData.helpers.PriceFormat((Number(slotData.totalPrice) / 3 ).toFixed(2))}}</span>
    </template>
    <template v-else-if="pageView=='list'">
        <span class='installment-label-list'>Or pay in 3 X </span>
        <span class='installment-price-list'>{{ slotData.display_currency }} {{slotData.helpers.PriceFormat((Number(data.display_price) / 3 ).toFixed(2))}}</span>
        <span class='with-label-list'>with</span>
        <img src='/images/extension/koko.png' alt='KokoPay' class='kokopay-logo-list' loading="lazy" decoding="async">
    </template>
    <template v-else>
        <span class='installment-label'>Or pay in 3 X </span>
        <span class='installment-price'>{{ slotData.display_currency }} {{slotData.helpers.PriceFormat((Number(slotData.displayPrice) / 3 ).toFixed(2))}}</span>
        <span class='with-label'>with</span>
        <img src='/images/extension/koko.png' alt='KokoPay' class='kokopay-logo' loading="lazy" decoding="async">
    </template>


</div>
