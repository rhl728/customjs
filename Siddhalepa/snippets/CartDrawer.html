<div>


<cart-icon-snippet   @open="openDrawer"  />

<div class="cart-drawer-wrapper bg-white h-full fixed top-0 right-0 w-full md:w-[450px] shadow-md transition duration-200 ease-in-out z-[1] " :class="[ slotData.active ? 'opacity-100 block fixed visible': 'hidden  opacity-0 invisible relative']">
    <div class="w-full flex justify-between items-center relative pl-5 md:pl-7 py-2 border-b border-gray-100">

        <div class="w-full">
            <span class="inline-block title text-primary font-bold text-xl pt-2 pb-1 my-0">{{slotData.language.cart.shoppingCart.title}}</span>

           <div class="flex justify-between">
               <a class="text-sm items-center  font-semibold text-body flex hover:text-heading transition ease-in-out  mb-1" href="/shopping-cart"> <b-icon class="w-6 h-6 pr-2" icon="cart3"></b-icon>{{slotData.language.cart.shoppingCart.viewCart}}</a>
               <!-- <clear-cart-snippet  /> -->
           </div>
        </div>
        <button
        v-on:click="closeDrawer"
        type="button"
        class="flex text-2xl items-center justify-center text-gray-500 px-4 focus:outline-none transition-opacity hover:opacity-60"
        >
            <b-icon icon="x" class="w-8 h-8 text-black"></b-icon>
        </button>


        
    </div>
    
    <cart-mini-product-list-section type="grid" :showCheckOut="true" :show_attribute_images="true"/>
   
</div>
<div  v-on:click="closeDrawer" class="mask z-0 top-0 left-0 bg-black fixed w-full" :class="[ slotData.active ? 'open opacity-30 h-full': ' opacity-0 h-0']"></div>

</div>
