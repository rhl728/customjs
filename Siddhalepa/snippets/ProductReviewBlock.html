<div
  class="border-b-[1px] border-[#CCCCCC] product-review-block flex flex-col space-y-4 w-full pb-4"
>
    <div class="flex flex-row space-x-3 items-center">
        <span class="text-sm text-[#5A5A5A] font-normal"><span class="font-semibold">{{review?.customer}}</span> on {{slotData.helpers.DateFormat(review?.created_at, 'DD MMM, YYYY')}}</span>
        <div class="h-5 pl-3 border-l border-[#212121] flex justify-center items-center pb-1">
            <star-rating
                :star-size="20"
                :rating="Number(review?.rate)"
                :increment="0.1"
                :show-rating="false"
                active-color="#F07E19"
                inactive-color="#D9D9D9"
                :read-only="true"
            />
        </div>
    </div>
    <div class="flex flex-col md:flex-row max-md:space-y-2 w-full">
        <div class="w-full md:w-3/5">
            <span class="whitespace-normal break-all text-[#212121] font-normal text-sm">{{review?.comment}}</span>
        </div>
        <div class="flex flex-wrap space-x-2 w-full md:w-2/5 md:justify-end justify-start items-start">
            <div v-for="(file, index) in review?.images" :key="file.id">
                <!-- Image -->
                <img
                    v-if="file.type === 'image'"
                    :src="file.path"
                    alt="review image"
                    class="w-[84px] h-[84px] object-cover border-[0.5px] border-[#CCCCCC] rounded cursor-pointer mb-1"
                    @click="openLightbox(index)"
                />

                <!-- Video -->
                <div
                    v-else-if="file.type === 'video'"
                    class="relative w-[84px] h-[84px] border-[0.5px] border-[#CCCCCC] rounded mb-1"
                >
                    <video
                    :src="file.path"
                    class="w-[84px] h-[84px] object-cover rounded cursor-pointer"
                    @click="openLightbox(index)"
                    ></video>
                    <span class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 16 16"
                            class="w-7 h-7"
                            fill="white"
                            stroke="#CCCCCC"
                            stroke-width="0.5"
                        >
                            <path d="M11.596 8.697l-6.363 3.692A.5.5 0 0 1 4.5 12V4a.5.5 0 0 1 .733-.442l6.363 3.692a.5.5 0 0 1 0 .868z" />
                        </svg>
                    </span>    
                </div>
            </div>
        </div>
        <fs-lightbox
            :toggler="slotData.lightboxToggler"
            :sources="lightboxSources"
            :slide="selectedIndex + 1"
        />
    </div>
</div>
