<div v-if="slotData.settingLoaded">
    <header-block-section />
    <div class="relative mt-[90px]">
      <div class="main-loader absolute top-0 left-0 w-full" v-if="mainLoader">
        <progress-bar-snippet />
      </div>
    </div>
    <div class="content-wrapper mx-auto max-w-[1920px] px-4 md:px-8 2xl:px-16" >
            <div class="breadcrumb pt-8 mb-8">
                <div class="breadcrumb-inner flex items-center">
                    <ul class="flex items-center w-full overflow-hidden text-gray-500 list-none my-0">
                        <li class="text-sm px-2.5 transition duration-200 ease-in first:pl-0 last:pr-0 "><a href="/" class="text-body hover:text-primary">Home</a></li>
                        <li class="text-base mt-0.5">/</li>
                        <li class="text-sm px-2.5 transition duration-200 ease-in first:pl-0 last:pr-0 text-primary">{{slotData.language.allCategories.title}}</li>
                    </ul>
                </div>
            </div>

            <div class="main-wrapper">
                <div class="main-title-wrapper mb-6">
                    <h1 class="text-lg md:text-xl xl:text-2xl font-bold text-heading mb-6 xl:mb-8 mt-0">{{slotData.language.allCategories.heading}}</h1>
                </div>
                <all-category-list-template />
            </div>
     </div>
    <footer-block-section />
</div>
