
<div v-if="slotData.settingLoaded">
  <header-block-section  />

  <div class="content-wrapper mx-auto max-w-[1920px] px-4 md:px-8 2xl:px-16 mt-[90px] xl:px-32 2xl:px-44 3xl:px-56 py-16 lg:py-20">

    <div  class="border border-gray-300 bg-gray-50 px-4 lg:px-5 py-4 rounded-md flex items-center justify-start text-heading text-sm md:text-base mb-6 lg:mb-8 flex items-center">
        <span class="w-10 h-10 mr-3 lg:mr-4 rounded-full bg-gray-200 flex items-center justify-center flex-shrink-0">
            <b-icon icon="exclamation-triangle-fill" class="error-icon w-5 h-5 text-red-500"></b-icon>
        </span>


        <span class="mr-2">
            <span>
                {{slotData.language.paymentError.title}}<br/>
            </span>
            <span class="text-xs lg:text-sm text-gray-500 ">{{slotData.language.paymentError.description}}</span>
        </span>


        <button type="button" class="retry flex ml-auto items-center" v-on:click="retryPayment"  :class="{'pointer-events-none': slotData.submitLoading}">
            <template v-if="slotData.submitLoading">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </template>
            <template v-else>
                <b-icon icon="arrow-counterclockwise" class="icon h-5 w-5"></b-icon>
                <span class="ml-1">{{slotData.language.paymentError.retryText}}</span>
            </template>
        </button>
     
    </div>


    <ul
      class="border border-gray-300 bg-gray-50 rounded-md flex flex-col md:flex-row mb-7 lg:mb-8 xl:mb-10 list-none"
    >
    <template v-if="slotData.orderInfo">
      <li
        class="text-heading font-semibold text-base lg:text-lg border-b md:border-b-0 md:border-r border-dashed border-gray-300 px-4 lg:px-6 xl:px-8 py-4 md:py-5 lg:py-6 last:border-0"
      >
        <span class="uppercase text-[11px] block text-body font-normal leading-5">
            {{slotData.language.paymentError.orderNumber}}
        </span>
        #{{slotData.orderInfo.order_id}}
      </li>
    </template>
    <template v-if="slotData.transactionId">
        <li
          class="text-heading font-semibold text-base lg:text-lg border-b md:border-b-0 md:border-r border-dashed border-gray-300 px-4 lg:px-6 xl:px-8 py-4 md:py-5 lg:py-6 last:border-0"
        >
          <span
            class="uppercase text-[11px] block text-body font-normal leading-5"
            > {{slotData.language.paymentError.transactionNumber}}</span
          >#{{slotData.transactionId}}
        </li>
    </template>
     
    </ul>

    <div class="inner-content-wrapper">

      <div class="button-wrapper">
        <a class="text-[13px] md:text-base md:text-sm1 leading-4 inline-flex items-center cursor-pointer transition ease-in-out duration-300 font-semibold font-body text-center justify-center border-0 border-transparent rounded-md placeholder-white focus-visible:outline-none focus:outline-none bg-primary text-white px-5 md:px-6 lg:px-8 py-4 md:py-3.5 lg:py-4 hover:text-white hover:bg-gray-600 hover:shadow-md w-full sm:w-auto" v-on:click="backToCart">
            <span class="button-label">
              {{slotData.language.paymentError.backToCartText}}
            </span>
        </a>
      </div>
    </div>
  </div>
  <footer-block-section  />
</div>

  <page-loader-snippet  />
</div> -->
