<!-- ============================================================
     DOWNLOADS PAGE — BODY SECTION ONLY
     Header & footer are provided elsewhere on the site.
     Drop this markup where the body content belongs, and include
     the <style> and <script> blocks (or move them to your own
     CSS/JS files) on the page that uses this section.
============================================================= -->

<style>
  :root{
    --nv-navy:        #2e2a6e;
    --nv-navy-deep:   #211d52;
    --nv-ink:         #1c1a3c;
    --nv-paper:       #f7f7fb;
    --nv-line:        #e3e2ef;
    --nv-muted:       #6c6a8c;
    --nv-accent:      #e8472b;  /* warm coral — used for the download button only,
                                   so it reads clearly as an action against the
                                   navy/photo card without fighting the brand color */
    --nv-accent-deep: #c93a20;
    --nv-radius:      14px;
  }

  .nv-downloads,
  .nv-downloads *{
    box-sizing: border-box;
  }

  .nv-downloads{
    background: var(--nv-paper);
    padding: 56px 24px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--nv-ink);
    width: 100%;
  }

  .nv-downloads__inner{
    max-width: 1140px;
    width: 100%;
    margin: 0 auto;
  }

  /* ---------- Heading ---------- */
  .nv-downloads__header{
    margin-bottom: 40px;
    text-align: left;
  }

  .nv-downloads__eyebrow{
    display: inline-block;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--nv-accent-deep);
    margin: 0 0 10px;
  }

  .nv-downloads__title{
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1.1;
    font-weight: 800;
    color: var(--nv-navy-deep);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .nv-downloads__subtitle{
    font-size: 16px;
    color: var(--nv-muted);
    max-width: 560px;
    margin: 0;
  }

  /* ---------- Category card grid ---------- */
  .nv-downloads .nv-grid{
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 22px;
    width: 100%;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  /* Each category is now a single self-contained card:
     image on top, name bar below, download button floated
     top-right over the image. */
  .nv-downloads .nv-card{
    position: relative;
    display: flex !important;
    flex-direction: column;
    background: #ffffff;
    border: 1px solid var(--nv-line);
    border-radius: var(--nv-radius);
    overflow: hidden;
    width: 100%;
    min-width: 0;
    text-decoration: none;
    cursor: default;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }

  /* Hover = "little bit darker" image + gentle lift, per request */
  .nv-downloads .nv-card:hover{
    box-shadow: 0 10px 24px rgba(33, 29, 82, 0.16);
    transform: translateY(-3px);
  }

  .nv-downloads .nv-card:hover .nv-card__image{
    filter: brightness(0.78);
  }

  .nv-downloads .nv-card__image{
    width: 100%;
    aspect-ratio: 4 / 3;
    background-size: cover;
    background-position: center;
    background-color: var(--nv-line); /* shows while image loads / if missing */
    transition: filter 0.2s ease;
  }

  /* Download button — top right, floating over the image */
  .nv-downloads .nv-card__btn{
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 50%;
    background: var(--nv-accent);
    border: none;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .nv-downloads .nv-card__btn:hover{
    background: var(--nv-accent-deep);
  }

  .nv-downloads .nv-card__btn:active{
    transform: scale(0.92);
  }

  .nv-downloads .nv-card__btn svg{
    width: 18px;
    height: 18px;
    stroke: #fff;
  }

  .nv-downloads .nv-card__btn:focus-visible{
    outline: 2px solid #fff;
    outline-offset: 2px;
  }

  /* tiny "downloaded" confirmation flash */
  .nv-downloads .nv-card__btn.is-done{
    background: #1f9d55;
  }

  /* Name bar — solid color strip below the image, not over it */
  .nv-downloads .nv-card__namebar{
    background: var(--nv-navy-deep);
    padding: 14px 16px;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
  }

  .nv-downloads .nv-card__name{
    font-size: 15.5px;
    font-weight: 700;
    color: #ffffff;
    margin: 0;
    line-height: 1.3;
    letter-spacing: 0.01em;
  }

  /* ---------- Empty state (no category data at all) ---------- */
  .nv-downloads .nv-empty{
    border: 1.5px dashed var(--nv-line);
    border-radius: var(--nv-radius);
    padding: 22px;
    color: var(--nv-muted);
    font-size: 14px;
    text-align: center;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 920px){
    .nv-downloads .nv-grid{
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    }
  }

  @media (max-width: 600px){
    .nv-downloads{
      padding: 40px 16px 56px;
    }
    .nv-downloads .nv-grid{
      grid-template-columns: 1fr !important;
    }
    .nv-downloads .nv-card__namebar{
      padding: 12px 14px;
    }
  }
</style>

<section class="nv-downloads" id="downloads">
  <div class="nv-downloads__inner">

    <div class="nv-downloads__header">
      <p class="nv-downloads__eyebrow">Resources</p>
      <h1 class="nv-downloads__title">Downloads</h1>
      <p class="nv-downloads__subtitle">
        Product brochures, manuals and certificates — tap a category to save its PDF.
      </p>
    </div>

    <!-- Category cards render here -->
    <div id="nv-downloads-root"></div>

  </div>
</section>

<script>

  document.addEventListener("oms_getTemplateListSuccess", () => {

  /* ====================================================================
     DATA
     Replace this array with your real categories.
     Each category now has exactly ONE pdf:
       - name  : category name shown on the card
       - file  : path/URL to the PDF
       - image : background image for the card (path/URL)
  ==================================================================== */
  const DOWNLOAD_DATA = [
    {
      name: "Product Brochures",
      file: "files/novatec-catalogue-2026.pdf",
      image: "images/product-brochures.jpg"
    },
    {
      name: "User Manuals",
      file: "files/washing-machine-manual.pdf",
      image: "images/user-manuals.jpg"
    },
    {
      name: "Warranty Information",
      file: "files/warranty-terms.pdf",
      image: "images/warranty-information.jpg"
    },
    {
      name: "Certificates & Compliance",
      file: "files/iso-9001-certificate.pdf",
      image: "images/certificates-compliance.jpg"
    },
    {
      name: "Price Lists",
      file: "files/retail-price-list-q3-2026.pdf",
      image: "images/price-lists.jpg"
    }
  ];

  const DOWNLOAD_ICON = `
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v12" stroke-width="2" stroke-linecap="round"/>
      <path d="M7 11l5 5 5-5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 19h16" stroke-width="2" stroke-linecap="round"/>
    </svg>`;

  const CHECK_ICON = `
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 13l4 4L19 7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function buildCard(item){
    const card = document.createElement("div");
    card.className = "nv-card";

    card.innerHTML = `
      <div class="nv-card__image" style="background-image:url('${item.image}')"></div>
      <button class="nv-card__btn" type="button" aria-label="Download ${escapeHtml(item.name)}">
        ${DOWNLOAD_ICON}
      </button>
      <div class="nv-card__namebar">
        <p class="nv-card__name">${escapeHtml(item.name)}</p>
      </div>
    `;

    const btn = card.querySelector(".nv-card__btn");
    btn.addEventListener("click", () => triggerDownload(item, btn));

    return card;
  }

  function triggerDownload(item, btn){
    const originalHTML = btn.innerHTML;
    btn.disabled = true;

    fetch(item.file)
      .then((res) => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.blob();
      })
      .then((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = item.name ? item.name + ".pdf" : "download.pdf";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        // Brief visual confirmation on the button itself.
        btn.innerHTML = CHECK_ICON;
        btn.classList.add("is-done");

        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.classList.remove("is-done");
          btn.disabled = false;
        }, 1400);
      })
      .catch((err) => {
        console.error("Download failed:", err);
        alert("Sorry, that file couldn't be downloaded. Please try again.");
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      });
  }

  function render(){
    const root = document.getElementById("nv-downloads-root");
    if (!root) return;
    root.innerHTML = "";

    if (!DOWNLOAD_DATA.length){
      const empty = document.createElement("div");
      empty.className = "nv-empty";
      empty.textContent = "No downloads available yet.";
      root.appendChild(empty);
      return;
    }

    const grid = document.createElement("div");
    grid.className = "nv-grid";
    DOWNLOAD_DATA.forEach((item) => grid.appendChild(buildCard(item)));
    root.appendChild(grid);
  }

  render();
  });

</script>
