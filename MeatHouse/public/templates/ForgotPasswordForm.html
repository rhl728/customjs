<div>
  <form @submit="formSubmit" class="flex flex-col justify-center" novalidate>
    <div class="block mb-4">
      <label
        for="email"
        class="block text-gray-600 font-semibold text-sm leading-none mb-3 cursor-pointer required"
      >
        {{slotData.language.forgotPassword.fields.email}}
      </label>
      <input
        type="email"
        id="email"
        :placeholder="slotData.language.loginPopup.fields.email"
        v-model="slotData.email"
        class="py-2 px-4 md:px-5 w-full appearance-none transition duration-150 ease-in-out border text-input text-xs lg:text-sm font-body rounded-md placeholder-body placeholder-slate-400 min-h-12 transition duration-200 ease-in-out bg-white border-gray-300 focus:outline-none focus:border-heading h-11 md:h-12"
        required
      />

      <div
        class="success-msg my-2 text-xs text-green-700"
        v-if="slotData.successMessage"
      >
        {{slotData.successMessage}}
      </div>
      <div
        class="error-msg my-2 text-xs text-red-500"
        v-if="slotData.errorMessage"
      >
        {{slotData.errorMessage}}
      </div>

      <p v-if="slotData.emailError" class="my-2 text-xs text-red-500">
        {{slotData.language.forgotPassword.errors.emailEmpty}}
      </p>
      <p v-if="slotData.emailInvalid" class="my-2 text-xs text-red-500">
        {{slotData.language.forgotPassword.errors.emailInvalid}}
      </p>
    </div>

    <div class="form-field row justify-content-end">
      <div class="col-md-3 col-sm-12">
        <button
          type="submit"
          class="submit-button submit-button text-[13px] md:text-sm leading-4 inline-flex items-center cursor-pointer transition ease-in-out duration-300 font-semibold font-body text-center justify-center border-0 border-transparent rounded-md placeholder-white focus-visible:outline-none focus:outline-none bg-primary text-white px-5 md:px-6 lg:px-8 py-4 md:py-3.5 lg:py-4 hover:text-white hover:bg-gray-600 hover:shadow-cart h-11 md:h-12 w-full mt-1.5"
        >
          <span class="button-label" v-if="slotData.submitLoading">
            <svg
              class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
          </span>
          <span class="button-label" v-else>
            {{slotData.language.forgotPassword.fields.reset}}
          </span>
        </button>
      </div>
    </div>

    <div
      class="flex flex-col items-center justify-center relative text-sm text-heading mt-8 sm:mt-10 mb-6 sm:mb-7"
    >
      <hr class="w-full border-gray-300" />
      <span class="absolute -top-2.5 px-2 bg-white"
        >{{slotData.language.forgotPassword.or}}</span
      >
    </div>

    <div class="text-sm sm:text-base text-body text-center">
      <label class="form-label">
        {{slotData.language.forgotPassword.backTo}}
        <a
          href="/login"
          class="text-sm sm:text-base text-heading underline font-bold hover:no-underline focus:outline-none"
        >
          {{slotData.language.forgotPassword.login}}
        </a>
      </label>
    </div>
  </form>
</div>
