<div
  class="fixed z-10 inset-0 overflow-y-auto"
  aria-labelledby="modal-title"
  role="dialog"
  aria-modal="true"
  :class="[ isActive ? 'block': 'hidden']"
>
  <div
    class="overlay transition duration-300 ease-in-out z-10 flex w-full h-full fixed top-0 left-0 bg-black bg-opacity-70"
    role="button"
    :class="[ isActive ? 'visible opacity-100': 'opacity-0 invisible']"
    v-on:click="toggleModal"
  ></div>

  <div
    tabindex="-1"
    aria-hidden="true"
    class="flex overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 w-full md:inset-0 h-modal md:h-full justify-center items-center"
    :class="[ isActive ? 'flex': 'hidden ']"
  >
    <div class="relative p-4 w-full max-w-2xl h-full md:h-auto">
      <div class="relative bg-white rounded-lg shadow">
        <div class="flex justify-between items-start p-4 rounded-t border-b">
          <h3 class="text-xl font-semibold text-black">
            {{slotData.language.locationSearch.selectLocation}}
          </h3>
          <button
            type="button"
            class="text-gray-900 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center"
            v-on:click="toggleModal"
          >
            <svg
              class="w-5 h-5"
              fill="currentColor"
              viewBox="0 0 20 20"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              ></path>
            </svg>
          </button>
        </div>

        <div class="p-6 space-y-6 max-h-[80vh] overflow-auto">
          <template v-for="location in slotData.settings.locations">
            <div
              class="info-inner-wrapper relative rounded-md group box-border overflow-hidden flex flex-nowrap rounded-md bg-transparent border border-gray-100 transition duration-200 ease-in-out transform hover:shadow-md pr-4"
            >
              <template v-if="location.image">
                <div
                  class="image-wrapper flex flex-shrink-0 w-32 sm:w-44 md:w-36 lg:w-44 h-16 md:h-44 bg-center bg-no-repeat mr-4 bg-cover"
                  v-bind:style="{ backgroundImage: 'url(' + location.image + ')' }"
                ></div>
                <div class="pl-3 pb-4 w-full">
                  <div
                    class="name font-semibold min-[450px]:mt-3 mb-1 md:mb-1 text-sm sm:text-base md:text-sm lg:text-base flex flex-col min-[450px]:flex-row min-[450px]:justify-between justify-start w-full"
                  >
                    {{ location.name }}

                    <template v-if="location.id != slotData.locationId">
                      <button
                        v-on:click="onClickChangeLocation(location.id)"
                        class="change-btn md:text-sm leading-4 inline-flex items-center cursor-pointer transition ease-in-out duration-300 font-semibold text-center justify-center border-0 border-transparent rounded-md focus-visible:outline-none focus:outline-none bg-primary text-white px-5 md:px-6 lg:px-8 py-4 md:py-3.5 hover:bg-gray-600 max-[450px]:h-6 h-8 max-[450px]:w-full max-[450px]:mt-2"
                      >
                        Select
                      </button>
                    </template>
                    <template v-else>
                      <span
                        class="md:text-sm leading-4 inline-flex items-center transition font-semibold text-center justify-center border border-primary rounded-md focus-visible:outline-none focus:outline-none max-[450px]:px-2 px-6 lg:px-8 md:py-3.5 py-4 lg:py-4 max-[450px]:h-6 h-8 ml-auto max-[450px]:w-full max-[450px]:mt-2"
                      >
                        {{slotData.language.locationSearch.currentLocation}}</span
                      >
                    </template>
                  </div>
                  <div class="hidden md:flex">
                    <template v-if="location.description">
                      <template v-if="slotData.showMore[location.id]">
                        <div
                          class="description text-gray-500 pl-2 md:pl-0"
                          v-html="location.description"
                        ></div>
                        <span
                          class="show-more font-semibold cursor-pointer flex items-center text-sm mt-2 uppercase mb-3"
                          v-on:click="slotData.showMore[location.id] = false"
                          v-if="location.description.length > 100"
                          ><b-icon class="mr-1" icon="caret-up"></b-icon
                          >Close</span
                        >
                      </template>
                      <template v-else-if="location.description.length > 140">
                        <div
                          class="description text-gray-500 pl-2 md:pl-0"
                          v-html="location.description.slice(0, 140) + '...'"
                        ></div>
                        <span
                          class="show-more font-semibold cursor-pointer flex items-center text-sm mt-2 uppercase mb-3"
                          v-on:click="slotData.showMore[location.id] = true"
                          v-if
                        >
                          <b-icon class="mr-1" icon="caret-down"></b-icon>More
                          Details</span
                        >
                      </template>
                      <template v-else>
                        <div
                          class="description text-gray-500 pl-2 md:pl-0"
                          v-html="location.description.slice(0, 140)"
                        ></div>
                      </template>
                    </template>
                  </div>
                </div>
              </template>
              <template v-else>
                <div class="pl-3 pb-4 w-full">
                  <div
                    class="name font-semibold min-[450px]:mt-3 mb-1 md:mb-1 text-sm sm:text-base md:text-sm lg:text-base flex justify-between w-full items-start gap-6"
                  >
                    <h3
                      class="whitespace-nowrap text-sm font-semibold w-1/2 mr-10"
                    >
                      {{ location.name }}
                    </h3>

                    <template v-if="location.id != slotData.locationId">
                      <button
                        v-on:click="onClickChangeLocation(location.id)"
                        class="change-btn md:text-sm leading-4 inline-flex items-center cursor-pointer transition ease-in-out duration-300 font-semibold text-center justify-center border-0 border-transparent rounded-md focus-visible:outline-none focus:outline-none bg-primary text-white px-5 md:px-6 lg:px-8 py-4 md:py-3.5 hover:bg-gray-600 max-[450px]:h-6 h-8 max-[450px]:w-full max-[450px]:mt-2"
                      >
                        Select
                      </button>
                    </template>
                    <template v-else>
                      <span
                        class="md:text-sm leading-4 inline-flex items-center transition font-semibold text-center justify-center border border-primary rounded-md focus-visible:outline-none focus:outline-none max-[450px]:px-2 px-6 lg:px-8 md:py-3.5 py-4 lg:py-4 max-[450px]:h-6 h-8 ml-auto max-[450px]:w-full max-[450px]:mt-2"
                      >
                        {{slotData.language.locationSearch.currentLocation}}</span
                      >
                    </template>
                  </div>
                  <div class="hidden md:flex">
                    <template v-if="location.description">
                      <template v-if="slotData.showMore[location.id]">
                        <div
                          class="description text-gray-500 pl-2 md:pl-0"
                          v-html="location.description"
                        ></div>
                        <span
                          class="show-more font-semibold cursor-pointer flex items-center text-sm mt-2 uppercase mb-3"
                          v-on:click="slotData.showMore[location.id] = false"
                          v-if="location.description.length > 100"
                          ><b-icon class="mr-1" icon="caret-up"></b-icon
                          >Close</span
                        >
                      </template>
                      <template v-else-if="location.description.length > 140">
                        <div
                          class="description text-gray-500 pl-2 md:pl-0"
                          v-html="location.description.slice(0, 140) + '...'"
                        ></div>
                        <span
                          class="show-more font-semibold cursor-pointer flex items-center text-sm mt-2 uppercase mb-3"
                          v-on:click="slotData.showMore[location.id] = true"
                          v-if
                        >
                          <b-icon class="mr-1" icon="caret-down"></b-icon>More
                          Details</span
                        >
                      </template>
                      <template v-else>
                        <div
                          class="description text-gray-500 pl-2 md:pl-0"
                          v-html="location.description.slice(0, 140)"
                        ></div>
                      </template>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
</div>
