<div
  class="fixed z-[13] inset-0 overflow-y-auto block"
  aria-labelledby="modal-title"
  role="dialog"
  aria-modal="true"
  :class="[ isActive ? 'block': 'hidden']"
>
  <div
    class="overlay transition duration-300 ease-in-out z-10 flex w-full h-full fixed top-0 left-0 bg-black bg-opacity-70"
    role="button"
    aria-label="This shop is for testing purposes only"
    :class="[ isActive ? 'visible opacity-100': 'opacity-0 invisible']"
    v-on:click="toggleModal"
  ></div>

  <div
    tabindex="-1"
    aria-hidden="true"
    class="flex overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 w-full md:inset-0 h-modal md:h-full justify-center items-center"
    :class="[ isActive ? 'flex': 'hidden ']"
  >
    <div class="relative p-4 w-full max-w-xl ">
      <div class="relative bg-white shadow p-8" >
        
        <div class="flex justify-between items-start  ">
          <b-icon class="add-to-cart-icon w-6 h-6 text-warning mr-2 mt-0.5" icon="exclamation-triangle-fill"  ></b-icon>
          <h3 class="title text-primary font-bold text-xl my-0">
            Shop Unavailable for Orders
          </h3>
          <button
          type="button"
          class="text-gray-900 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center"
          v-on:click="toggleModal"
        >
          <svg
            class="w-5 h-5"
            fill="currentColor"
            viewBox="0 0 20 20"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </button>
        </div>

        <div class="popup-content overflow-auto min-h-[15vh] max-h-[65vh]">

          <div class=" py-3 space-y-6 max-h-[80vh] overflow-auto">
            
  
                Please Note: This shop is for testing purposes only. Please DO NOT place real orders or provide any personal or sensitive information. Any actions taken on this shop will not result in actual transactions, shipments, or charges
             
          </div>
          <!-- <div class="flex justify-end p-4">
            <button class="bg-[#FEA400] text-white font-bold py-2 px-4 rounded" v-on:click="toggleModal">Continue</button>
          </div> -->
        
          
          
            
        </div>

      </div>
    </div>
  </div>
</div>
