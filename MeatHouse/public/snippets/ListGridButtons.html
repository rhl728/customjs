<div class="flex items-center">
    <button class="mr-2 p-1.5 rounded-md" @click="changeView('grid')" title="Grid View" :class="{'selected text-white bg-primary': gridView}">
            <b-icon class="w-5 h-5" icon="grid-3x3-gap-fill" ></b-icon>
    </button>

    <button class="p-1.5 rounded-md" @click="changeView('list')" title="List View" :class="{'selected text-white bg-primary': !gridView}">
         <b-icon class="w-5 h-5" icon="list-ul" ></b-icon>
    </button>
</div>
