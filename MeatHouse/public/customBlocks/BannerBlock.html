<div v-if="imageArray.length > 0" class="relative">
    <template v-if="title || description || show_button">
        <div class="inner-content text-center absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
            <div class="title banner-title text-white text-lg md:text-xl lg:text-3xl 2xl:text-4xl xl:leading-10 font-bold mb-6" v-if="title">
                {{title}}
            </div>
            <div class="banner-description text-gray-600 mb-6" v-if="description">
                {{description}}
            </div>

            <div class="banner-button-wrapper mt-10" v-if="show_button" :data-btn="show_button">
                <template v-if="button_url">
                    <a class="btn-text bg-transparent hover:bg-slate-900 text-slate-700 font-semibold hover:text-white py-2 px-4 border border-slate-500 hover:border-transparent rounded" :href="button_url"> {{button_text}} </a>
                </template>
                <template v-else>
                    <span class="btn-text">{{button_text}}</span>
                </template>
            </div>
        </div>
    </template>

    <template v-if="slotData.slideShow">


        {{slotData.slideBreakpoints}}
        <vue-slick-carousel 
            :arrows="slotData.slideArrows" 
            :dots="slotData.slideDots" 
            :infinite="true" 
            :slidesToShow="1"
            :slidesToScroll="slotData.slidesToScroll" 
            :rows="slotData.row"
            :autoplay="slotData.slideAutoplay" 
            :speed="slotData.slideShowSpeed" 
            :autoplaySpeed="slotData.autoplaySpeed"
            :centerMode="slotData.centerMode"
            :responsive="slotData.sliderResponsive" 
    
            class="slide-show"
            >

            <div class="banner-image group relative overflow-hidden" v-for="(image, key) in slotData.slidesList" >
                <div 
                :class="rounded_corners ? 'image bg-no-repeat bg-center bg-cover rounded-md overflow-hidden ' + slotData.bannerHeight : 'image bg-no-repeat bg-center bg-cover overflow-hidden ' + slotData.bannerHeight "
                :style="{'background-image': 'url(' + image.url + ')', 'height': slotData.bannerHeight }"
                >
                    <div class="image-inner-content" v-if="image.title || image.description || image.button_text">
                        <div class="banner-title" v-if="image.title">
                            {{image.title}}
                        </div>
                        <div class="banner-description" v-if="image.description">
                            {{image.description}}
                        </div>

                        <div class="banner-button-wrapper" v-if="image.button_text">
                            <template v-if="image.button_url">
                                <a class="btn-text" :href="image.button_url"  tabindex="-1"> {{image.button_text}} </a>
                            </template>
                            <template v-else>
                                <span class="btn-text">{{image.button_text}}</span>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="absolute top-0 -left-full h-full w-1/2 z-5 block transform -skew-x-12 bg-gradient-to-r from-transparent to-white opacity-40 group-hover:animate-shine"></div>
                <template v-if="image.button_url && slotData.slideLink">
                    <a class="btn-text absolute top-0 left-0 w-full h-full z-10" :href="image.button_url"  tabindex="-1"></a>
                </template>
            </div>

        </vue-slick-carousel>
    </template>

    <template v-else>

        <div class="banner-row" v-for="(row, index) in imageArray.length" :key="index" 
               :style="{width: index == imageArray.length - 1 ? lastRowWidth : '100%' }" >

               <div class="banner-image" v-for="(image, key) in imageArray[index]" :key="key"  :class="{'rounded-md overflow-hidden': rounded_corners}">

                <div :class="'image image-' + index + '-' + key + ' bg-no-repeat bg-center bg-cover overflow-hidden ' + slotData.bannerHeight" :style="{'background-image': 'url(' + image.url + ')', 'height': slotData.bannerHeight }">
                    <div class="image-inner-content text-center" v-if="image.title || image.description || image.button_text">
                        <div class="banner-title" v-if="image.title">
                            {{image.title}}
                        </div>
                        <div class="banner-description" v-if="image.description">
                            {{image.description}}
                        </div>

                        <div class="banner-button-wrapper" v-if="image.button_text">
                            <template v-if="image.button_url">
                                <a class="btn-text" :href="image.button_url"> {{image.button_text}} </a>
                            </template>
                            <template v-else>
                                <span class="btn-text"> {{image.button_text}} </span>
                            </template>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </template>
</div>
