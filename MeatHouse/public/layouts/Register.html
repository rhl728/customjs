<div  v-if="slotData.settingLoaded">
    <header-block-section  />

    <div class="content-wrapper mx-auto max-w-[1920px] px-4 md:px-8 2xl:px-16 mt-20">
        <div class="breadcrumb pt-8 mb-8">
            <div class="breadcrumb-inner flex items-center flex-col">
                <ul class="flex items-center w-full overflow-hidden text-gray-500 list-none my-0">
                    <li class="text-sm px-2.5 transition duration-200 ease-in first:pl-0 last:pr-0 "><a href="/" class="text-body hover:text-primary">Home</a></li>
                    <li class="text-base mt-0.5">/</li>
                    <li class="text-sm px-2.5 transition duration-200 ease-in first:pl-0 last:pr-0 text-primary">
                        {{slotData.language.registerPopup.title}}
                    </li>
                </ul>
            </div>
        </div>

        <div class="inner-content-wrapper overflow-hidden bg-white mx-auto rounded-lg w-full sm:w-96 md:w-[450px] border border-gray-300 py-5 px-5 sm:px-8 shadow-sm  mb-8 lg:mb-16">
           <!--  <div class="d-none d-sm-block" :class="customFields.length < 4 ? 'col-md-6' : 'col-md-4 sm-wrapper'">
                <welcome-block-section  />
            </div> -->
            <div class="form-wrapper col-xs-12" :class="customFields.length < 4 ? 'col-md-4' : 'col-md-8'">
                 <div class="main-title-wrapper  text-center">
                    <h1 class="text-lg md:text-xl xl:text-2xl font-bold text-heading mb-6 xl:mb-8 mt-0"> 
                        <template v-if="slotData.showOtpVerification">
                            {{slotData.language.loginPopup.verifyAccountText}}
                        </template>
                        <template v-else>
                            {{slotData.language.registerPopup.title}}
                        </template>
                    </h1>
                </div>
                <register-form-template  :customFields="customFields" :social_login="true" />
            </div>
        </div>
    </div>
    <footer-block-section  />
</div>

    <page-loader-snippet  />
</div> -->
