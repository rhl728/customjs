            <div class="breadcrumb pt-8 mb-8">
                <div class="breadcrumb-inner flex items-center">

                    </ul>
                </div>
            </div>


            <div class="flex flex-wrap xl:mb-4 cart-inner-wrapper items-start" v-if="slotData.selectedProducts && Object.keys(slotData.selectedProducts).length">

                        <h2 class="text-lg md:text-xl xl:text-2xl font-bold text-heading mb-6 xl:mb-8">{{slotData.language.cart.title}}</h2>
                        <mini-cart-section 
                        show_cart_icon="false"
                        show_cart_header="false"
                        show_products="false"
                        show_cart_instruction="false"
                        :button_text="slotData.language.cart.continueText"
                        button_url="/order-summary"
                        minimum_order_text="false" 
                        :soc_tpl="soc_tpl" />

                    </div>
                </div>

            </div>

            </div>
