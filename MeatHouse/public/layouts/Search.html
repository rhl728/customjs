<div class="bg-gray-50"  v-if="slotData.settingLoaded">
    <header-block-section  />
    <div class="relative flex flex-wrap lg:flex-nowrap mt-[90px] bg-white">
        <div class="main-loader absolute top-0 left-0 w-full" v-if="mainLoader">
            <progress-bar-snippet  />
        </div>
        <trail-popup-snippet  :is_active="slotData.isActive"></trail-popup-snippet>
        <div class="w-full lg:w-[320px] bg-white h-full">
             <h2 class="category-list-title font-semibold mt-6 m-4 text-sm sm:text-base md:text-sm lg:text-base xl:text-lg hidden lg:block">{{slotData.language.heading}}</h2>
            <template v-if="slotData.settingLoaded">
                <div class="hidden lg:block">
                    <category-base-list-template  :page="slotData.page" :items_to_show="20" :featured="slotData.featured"  />
                </div>
            </template>
      
        </div>
        <div class="w-full p-4 md:p-8">
            <product-list-template :categories="null" :page="slotData.page" :sort_property="'featured'" :sort_direction="'desc'" />
        </div>
    </div>
    <footer-block-section  />
</div>
