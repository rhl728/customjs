<div v-if="slotData.settingLoaded">
  <header-block-section  />

  <div class="bg-white p-4 md:p-8 2xl:px-24 flex flex-wrap mt-[90px] flex-col-reverse md:flex-row">

    <div class="w-full md:w-7/12 text-center md:text-left">
      <h1 class="text-heading text-lg md:text-xl lg:text-2xl 2xl:text-3xl xl:leading-10 font-bold md:mt-16" >
        {{slotData.language.pageNotFound.heading}}
       </h1>
       <p class="text-sm md:text-base text-body leading-7 pt-2 md:pt-3.5 pb-7 md:pb-9">
         {{slotData.language.pageNotFound.description}}
       </p>
       <a
         class="text-[13px] md:text-sm lg:text-base leading-4 inline-flex items-center cursor-pointer transition ease-in-out duration-300 bg-primary text-white px-4 md:px-6 py-2.5 lg:py-3 hover:text-white hover:bg-gray-600 hover:shadow-cart rounded-lg"
         href="/">
           <svg
               stroke="currentColor"
               fill="currentColor"
               stroke-width="0"
               viewBox="0 0 512 512"
               height="1em"
               width="1em"
               xmlns="http://www.w3.org/2000/svg" >
               <path d="M416 174.74V48h-80v58.45L256 32 0 272h64v208h144V320h96v160h144V272h64l-96-97.26z"></path>
           </svg>
           <span class="pl-1.5">{{slotData.language.pageNotFound.button}}</span></a>
    </div>
    <div class="w-full md:w-5/12 ">
      <div class="w-full h-96 bg-404 bg-center bg-no-repeat bg-contain mx-auto md:mb-6"  v-bind:style="{'background-image': 'url($$__client_media_url__$$/$$__client_media_path__$$/404.png)'}"></div>
    </div>

  </div>

  <footer-block-section  />
</div>
